name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run unit tests
        run: dotnet test tests/DesktopBuddy.Core.Tests/DesktopBuddy.Core.Tests.csproj -c Release

      - name: Publish self-contained exe
        run: dotnet publish src/DesktopBuddy/DesktopBuddy.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopBuddy-win-x64
          path: publish/DesktopBuddy.exe
